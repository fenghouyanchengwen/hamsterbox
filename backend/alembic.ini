# Alembic configuration.
# The database URL is resolved by migrations/env.py in this order:
# 1. an explicit set_main_option("sqlalchemy.url", ...) from CLI or tests;
# 2. the HAMSTERBOX_DB_URL environment variable;
# 3. the default data/library.db.
#
# This file must stay ASCII-only: configparser reads it with the platform
# default encoding on Windows.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
